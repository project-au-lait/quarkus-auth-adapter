services:
  keycloak:
    command: start-dev
    image: quay.io/keycloak/keycloak:26.6.1
    environment:
      FRONTEND_URL: http://localhost:${FRONTEND_PORT}
      KEYCLOAK_ADMIN: ${AUTH_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${AUTH_PASSWORD}
      KC_HEALTH_ENABLED: true
      TZ: ${OS_TIMEZONE}
    ports:
      - ${AUTH_PORT}:8080
      - ${AUTH_PORT_SSL}:8543

  keycloak-proxy:
    image: nginx:alpine
    environment:
      AUTH_PORT: ${AUTH_PORT}
    volumes:
      - ./target/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - keycloak

  # backend environment variables when running in Docker:
  #   AUTH_TOKEN_ENDPOINT: http://keycloak-proxy/realms/${AUTH_REALM}/protocol/openid-connect/token

  healthchecker:
    command: ["tail", "-f", "/dev/null"]
    image: alpine/curl
    healthcheck:
      test:
        ["CMD", "curl", "--head", "-fsS", "http://keycloak:9000/health/ready"]
      interval: 30s
      retries: 3
      start_period: 15s
      start_interval: 1s
      timeout: 10s

  smtp:
    image: axllent/mailpit:latest
    ports:
      - ${SMTP_WEB_PORT}:8025
    restart: always
